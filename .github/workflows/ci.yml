name: ci

# On a v* tag this runs from release.yml (workflow_call), which publishes
# nothing unless every job here passes.
on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
    secrets:
      KIT_IDENTIFIERS:
        required: true

permissions:
  contents: read

# The tarball's .tgz bytes depend on Node's zlib and its tar on npm, so the
# jobs that pack use exactly these (js/.node-version and NPM_VERSION).
env:
  NPM_VERSION: '11.9.0'

jobs:
  # Decision 0017 of the platform: the kit's Go compiles and passes on the Go
  # 1.26 line Wappie uses, here at 1.26.9, the first 1.26 release without the
  # net/http (HTTP/1 and HTTP/2), net/textproto and crypto/tls advisories that
  # govulncheck reports for 1.26.7. go.mod's go directive stays 1.26.7, the
  # oldest toolchain the kit supports (the job go-1-26-7 below compiles it
  # there). GOTOOLCHAIN=local stops go from switching toolchains; go vet's
  # stdversion analyzer flags any newer standard-library API. The tag
  # kitdevkek compiles kms/localkek, under which the tests of thcseal and
  # kms/awskms seal (SPEC section 14.3).
  go-1-26-9:
    name: go 1.26.9 (race, vet, gofmt, fuzz)
    runs-on: ubuntu-24.04
    env:
      GOTOOLCHAIN: local
      GOFLAGS: -mod=readonly -tags=kitdevkek
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.9'
          cache: false
      - run: go version | grep -q 'go1.26.9 '
      - run: go mod verify
      - name: gofmt
        run: test -z "$(gofmt -l $(find . -name '*.go' -not -path './js/*'))"
      - run: go vet ./...
      - run: go test -race -count=1 ./...
      # Only tests link the local KEK, only kms/awskms links the AWS SDK,
      # under any build constraint, and every package builds without the
      # tag, as a consumer's release does.
      - name: what the packages link
        run: make imports-check
      # The platform's generator at 75b6b94, kept in the kit, runs the kit's
      # own profile: it must write all fourteen platform files byte for byte.
      - name: the platform's files reproduce from the kit's copy of its generator
        run: make vectors-platform-regen
      # The parsers a server runs on untrusted input: the envelope, the
      # request signature, the key bundle, every field of the platform's
      # requests (addresses, base64url, recovery codes, relying party ids,
      # client extension results), what a relying party is sent, the
      # platform wrap an export carries (Wappie's, and the generic one under
      # every product's profile), THCSEAL's decoder and opener, and Mailie's
      # checks of the wraps, grants, ids and public keys its server stores.
      - name: fuzz the parsers
        run: |
          go test -run '^$' -fuzz '^FuzzOpen$' -fuzztime 30s ./seal
          go test -run '^$' -fuzz '^FuzzRead$' -fuzztime 30s ./reqhmac
          go test -run '^$' -fuzz '^FuzzParseKeyBundle$' -fuzztime 30s ./profiles/platform
          go test -run '^$' -fuzz '^FuzzPreparePassword$' -fuzztime 30s ./profiles/platform
          go test -run '^$' -fuzz '^FuzzOpenProductKey$' -fuzztime 30s ./profiles/platform
          go test -run '^$' -fuzz '^FuzzPKCEChallenge$' -fuzztime 30s ./profiles/platform
          go test -run '^$' -fuzz '^FuzzCheckClientExtensions$' -fuzztime 30s ./profiles/platform
          go test -run '^$' -fuzz '^FuzzValidRPID$' -fuzztime 30s ./profiles/platform
          go test -run '^$' -fuzz '^FuzzNormalizeEmail$' -fuzztime 30s ./profiles/platform
          go test -run '^$' -fuzz '^FuzzDecodeB64$' -fuzztime 30s ./profiles/platform
          go test -run '^$' -fuzz '^FuzzCanonicalRecoveryCode$' -fuzztime 30s ./profiles/platform
          go test -run '^$' -fuzz '^FuzzReadUserinfo$' -fuzztime 30s ./oidcrp
          go test -run '^$' -fuzz '^FuzzOpenPlatformWrap$' -fuzztime 30s ./profiles/wappie
          go test -run '^$' -fuzz '^FuzzOpen$' -fuzztime 30s ./platformwrap
          go test -run '^$' -fuzz '^FuzzDecodeAcceptsOnlyTheLayoutItDocuments$' -fuzztime 30s ./thcseal
          go test -run '^$' -fuzz '^FuzzOpenNeverOpensAnAlteredEnvelope$' -fuzztime 30s ./thcseal
          go test -run '^$' -fuzz '^FuzzServerChecks$' -fuzztime 30s ./profiles/mailie

  # What only the toolchain that wrote the vectors can check. The seeded
  # replays of Wappie's Go vectors run only on the toolchain a file records,
  # go1.26.7 (on any other they skip and say so), and the kit's generator of
  # Mailie's golden file records the toolchain it runs on; the files of a
  # tagged release never change, so both stay on go1.26.7, which also holds
  # every package and test to go.mod's go directive. Nothing built here is
  # shipped.
  go-1-26-7:
    name: go 1.26.7 (vet, replays, Mailie's golden file)
    runs-on: ubuntu-24.04
    env:
      GOTOOLCHAIN: local
      GOFLAGS: -mod=readonly -tags=kitdevkek
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.7'
          cache: false
      - run: go version | grep -q 'go1.26.7 '
      - run: go vet ./...
      - name: the replays ran rather than skipped
        run: |
          out=$(go test -count=1 -v -run 'TestWappieSealVectors|TestWappieRequestHMACVectors' ./seal ./reqhmac)
          if echo "$out" | grep -q 'replay needs'; then echo "replays skipped on go1.26.7"; exit 1; fi
      # The kit's generator of Mailie's golden file, which draws nothing
      # random and records go1.26.7, must write it byte for byte.
      - name: Mailie's golden file reproduces from the kit's generator
        run: make vectors-mailie-regen
      # Mailie's key-scheme files (SPEC Appendix D), from Mailie at c9c79cf:
      # every case runs, and profiles/mailie writes all four again byte for
      # byte, their seeded seals included, here as on go1.26.9 and stable.
      - name: Mailie's key-scheme files reproduce from the kit
        run: go test -count=1 -v -run '^(TestMailieKeySchemeVectors|TestTheKitWritesMailiesKeySchemeVectorsAgain)$' ./profiles/mailie

  go-current:
    name: go stable
    runs-on: ubuntu-24.04
    env:
      GOFLAGS: -tags=kitdevkek
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          cache: false
      - run: go vet ./...
      - run: go test -race -count=1 ./...
      # Go 1.27 builds encoding/json on its json/v2 engine, and Go 1.26 on
      # the classic one; the strict readers of the key bundle and of the
      # client-extension allowlist walk its token stream, so they are fuzzed
      # on this toolchain too.
      - name: fuzz the strict JSON readers
        run: |
          go test -run '^$' -fuzz '^FuzzCheckClientExtensions$' -fuzztime 30s ./profiles/platform
          go test -run '^$' -fuzz '^FuzzParseKeyBundle$' -fuzztime 30s ./profiles/platform

  # On the toolchain Wappie builds what it ships with, 1.26.9, and on the
  # newest one; one job, so the check keeps its name. GOTOOLCHAIN=local, so
  # each scan sees the standard library of the toolchain just set up.
  govulncheck:
    runs-on: ubuntu-24.04
    env:
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.9'
          cache: false
      - run: go version | grep -q 'go1.26.9 '
      # With the tag, so the local KEK is scanned too; kms/awskms, and the
      # AWS SDK it calls, build either way.
      - name: govulncheck on go1.26.9
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 -tags kitdevkek ./...
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          cache: false
      - name: govulncheck on go stable
        run: |
          go version
          go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 -tags kitdevkek ./...

  js:
    name: typescript (node ${{ matrix.node }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '25']
    defaults:
      run:
        working-directory: js
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  # The same vector specs in real browsers, where WebCrypto's X25519, PKCS#8
  # export and module workers are the browser's own. Required before a
  # release: release.yml runs this workflow and publishes only if it passes.
  js-browser:
    name: typescript in chromium, firefox and webkit
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: js
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: js/.node-version
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npm run test:browser

  # Fresh round trips: Go seals and TypeScript opens, TypeScript seals and Go
  # opens, with keys and nonces made in this run.
  cross:
    runs-on: ubuntu-24.04
    env:
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.9'
          cache: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: js
      - run: make cross

  vectors:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: manifest
        run: cd vectors && sha256sum -c --quiet MANIFEST.sha256
      - name: files of the last tag are unchanged
        run: |
          previous=$(git describe --tags --abbrev=0 --match 'v*' HEAD^ 2>/dev/null || true)
          if [ -z "$previous" ]; then echo "no earlier tag"; exit 0; fi
          changed=$(git diff --name-status "$previous" HEAD -- vectors/wappie vectors/kit vectors/platform vectors/mailie | grep -v '^A' || true)
          if [ -n "$changed" ]; then echo "vector files of $previous changed or disappeared:"; echo "$changed"; exit 1; fi

  # The kit is public, and so is its history: no identifier of a real AWS
  # account in the files, paths or commit messages of any commit of any
  # branch or tag the repository has (fetch-depth 0 fetches them all, and
  # --all reaches them, the checked-out commit included; make
  # identifiers-check). The owner's list of values is the repository secret
  # KIT_IDENTIFIERS, never a file of the repository; the job fails without
  # it, so it fails for a pull request from a fork.
  identifiers:
    name: no identifier of an AWS account
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - run: make identifiers-check IDENTIFIERS_REVS=--all
        env:
          KIT_IDENTIFIERS: ${{ secrets.KIT_IDENTIFIERS }}

  # Every byte of the tarball is measured in Wappie's enclave image: check what
  # is in it, that two builds from clean are identical, and that it installs
  # and works as a consumer gets it.
  package:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: js
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: js/.node-version
      - run: npm install --global "npm@${NPM_VERSION}" && npm --version | grep -qx "${NPM_VERSION}"
      - run: node --version | grep -qx "v$(cat .node-version)"
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: pack twice from clean and compare
        run: |
          if [ "${GITHUB_REF_TYPE}" = tag ]; then node scripts/pack.mjs --reproduce --tag "${GITHUB_REF_NAME}"; else node scripts/pack.mjs --reproduce; fi
      - run: node scripts/smoke.mjs
