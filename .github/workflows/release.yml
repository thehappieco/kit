name: release

# A v* tag publishes the npm tarball as a release asset. Wappie pins that
# asset by URL and integrity and measures it into its enclave image, and the
# checksum database keeps the Go module's first hash for ever, so nothing is
# published unless every check of ci.yml passes on the tagged commit and that
# commit is on main.
on:
  push:
    tags: ['v*']

permissions:
  contents: read

env:
  NPM_VERSION: '11.9.0'

jobs:
  ci:
    uses: ./.github/workflows/ci.yml
    secrets:
      KIT_IDENTIFIERS: ${{ secrets.KIT_IDENTIFIERS }}

  on-main:
    name: the tagged commit is on main
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - run: git merge-base --is-ancestor "${GITHUB_SHA}" origin/main

  release:
    needs: [ci, on-main]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: js/.node-version
      - run: npm install --global "npm@${NPM_VERSION}" && npm --version | grep -qx "${NPM_VERSION}"
      - run: node --version | grep -qx "v$(cat js/.node-version)"
      - run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: js
      - name: build the tarball twice from clean and compare
        run: node scripts/pack.mjs --reproduce --tag "${GITHUB_REF_NAME}"
        working-directory: js
      - run: node scripts/smoke.mjs
        working-directory: js
      - name: create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          tarball="thehappieco-kit-${version}.tgz"
          integrity="sha512-$(openssl dgst -sha512 -binary "js/${tarball}" | base64 -w0)"
          tar_sha256="$(gunzip -c "js/${tarball}" | sha256sum | cut -d' ' -f1)"
          url="https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/${tarball}"
          cat > notes.md <<NOTES
          Go: \`go get github.com/thehappieco/kit@${GITHUB_REF_NAME}\`

          TypeScript: \`npm install --save-exact ${url}\`

          Tarball integrity (what a lockfile pins): \`${integrity}\`

          The tar inside it, sha256: \`${tar_sha256}\`. Built with node $(node --version) and npm $(npm --version). To check it, rebuild from the tag with npm $(npm --version) and any Node 22 or later, \`cd js && npm ci --ignore-scripts && node scripts/pack.mjs\`, and compare the tar line of SHA256SUMS with \`gunzip -c ${tarball} | sha256sum\` of this asset. The .tgz bytes themselves also depend on Node's zlib; with node $(node --version) on linux-x64 they match too.
          NOTES
          gh release create "${GITHUB_REF_NAME}" "js/${tarball}" js/SHA256SUMS --title "${GITHUB_REF_NAME}" --notes-file notes.md --verify-tag
